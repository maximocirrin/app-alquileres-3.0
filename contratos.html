    <!-- Script de Barra Lateral / Dock de Navegación del Propietario -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.App && typeof window.App.setupTheme === 'function') {
                window.App.setupTheme();
            }

            const dockContainer = document.getElementById('owner-floating-dock-container');
            const nav = document.getElementById('floating-dock-nav');
            const indicator = document.getElementById('dock-active-indicator');
            const firmaBtn = document.getElementById('owner-dock-btn-firma');

            function updateDockIndicator() {
                if (!nav || !indicator) return;

                if (window.innerWidth >= 1024 && firmaBtn) {
                    const navRect = nav.getBoundingClientRect();
                    const btnRect = firmaBtn.getBoundingClientRect();
                    if (btnRect.width === 0 && btnRect.height === 0) return;

                    const topOffset = btnRect.top - navRect.top;
                    indicator.style.top = `${topOffset}px`;
                    indicator.style.height = `${btnRect.height}px`;
                    indicator.style.left = '0.5rem';
                    indicator.style.width = 'calc(100% - 1rem)';
                    indicator.style.bottom = 'auto';
                    indicator.style.right = '0.5rem';
                    indicator.style.opacity = '1';
                    indicator.style.display = 'block';
                } else {
                    indicator.style.opacity = '0';
                    indicator.style.display = 'none';
                }
            }

            let lastScrollY = window.scrollY;
            window.addEventListener('scroll', () => {
                if (window.innerWidth >= 1024) return;
                const currentScrollY = window.scrollY;
                if (dockContainer) {
                    if (currentScrollY > lastScrollY && currentScrollY > 100) {
                        dockContainer.classList.add('is-hidden');
                    } else {
                        dockContainer.classList.remove('is-hidden');
                    }
                }
                lastScrollY = currentScrollY;
            }, { passive: true });

            window.addEventListener('resize', () => {
                if (window.innerWidth >= 1024 && dockContainer) {
                    dockContainer.classList.remove('is-hidden');
                }
                updateDockIndicator();
            });

            setTimeout(updateDockIndicator, 50);
            setTimeout(updateDockIndicator, 200);
            setTimeout(updateDockIndicator, 600);
        });
    </script>
