<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hábitat</title>
    <link rel="icon" type="image/jpeg" href="img/isotipo-lite.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --background: #f9f9f9;
            --surface: #ffffff;
            --surface-soft: #f3f3f3;
            --text: #1a1c1c;
            --muted: #5e5e5e;
            --border: rgba(26, 28, 28, 0.12);
            --primary: #811b1e;
            --primary-hover: #a13333;
            --primary-soft: #ffdad7;
            --shadow: 0 24px 80px rgba(26, 28, 28, 0.08);
        }

        html.dark {
            --background: #09090b;
            --surface: #111113;
            --surface-soft: #18181b;
            --text: #f1f1f1;
            --muted: #c7c6c6;
            --border: rgba(255, 255, 255, 0.12);
            --primary: #a13333;
            --primary-hover: #b94444;
            --primary-soft: rgba(161, 51, 51, 0.18);
            --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--surface) 0 96px, var(--background) 96px 100%);
            color: var(--text);
            font-family: Inter, sans-serif;
        }

        .owner-auth-header {
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(20px, 4vw, 64px);
            border-bottom: 1px solid var(--border);
            background: color-mix(in srgb, var(--surface) 86%, transparent);
            backdrop-filter: blur(18px);
        }

        .owner-auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            text-decoration: none;
            font-family: Manrope, sans-serif;
            font-size: clamp(26px, 4vw, 36px);
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .owner-auth-logo img {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            object-fit: cover;
        }

        .owner-auth-language {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            font-size: 16px;
            font-weight: 800;
        }

        .owner-auth-main {
            min-height: calc(100vh - 96px);
            display: grid;
            place-items: center;
            padding: 56px 20px;
        }

        .owner-auth-card {
            width: min(100%, 740px);
            border: 1px solid var(--border);
            border-radius: 28px;
            background: color-mix(in srgb, var(--surface) 94%, transparent);
            box-shadow: var(--shadow);
            padding: clamp(28px, 5vw, 54px);
        }

        .owner-auth-title {
            margin: 0 0 14px;
            font-family: Manrope, sans-serif;
            font-size: clamp(38px, 7vw, 56px);
            font-weight: 500;
            line-height: 0.98;
            letter-spacing: 0;
            text-align: center;
        }

        .owner-auth-subtitle {
            margin: 0 0 34px;
            color: var(--muted);
            font-size: clamp(17px, 3vw, 22px);
            line-height: 1.45;
            text-align: center;
        }

        .owner-auth-google {
            width: 100%;
            min-height: 68px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .owner-auth-google:hover {
            transform: translateY(-1px);
            border-color: color-mix(in srgb, var(--primary) 50%, var(--border));
            box-shadow: 0 12px 24px rgba(129, 27, 30, 0.12);
        }

        .google-mark {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #4285f4;
            background: #ffffff;
        }

        .owner-auth-divider {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 18px;
            align-items: center;
            color: var(--muted);
            margin: 34px 0 28px;
            font-size: 17px;
        }

        .owner-auth-divider::before,
        .owner-auth-divider::after {
            content: "";
            height: 1px;
            background: var(--border);
        }

        .owner-auth-form {
            display: grid;
            gap: 20px;
        }

        .owner-auth-field {
            display: grid;
            gap: 8px;
        }

        .owner-auth-field label {
            font-size: 16px;
            font-weight: 800;
        }

        .owner-auth-field input {
            width: 100%;
            min-height: 66px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface);
            color: var(--text);
            padding: 0 20px;
            font-size: 19px;
            outline: none;
            transition: border-color 180ms ease, box-shadow 180ms ease;
        }

        .owner-auth-field input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 14%, transparent);
        }

        .owner-auth-submit {
            width: 100%;
            min-height: 68px;
            border: 0;
            border-radius: 18px;
            background: var(--primary);
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 180ms ease, background-color 180ms ease, opacity 180ms ease;
        }

        .owner-auth-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .owner-auth-submit:disabled {
            cursor: not-allowed;
            opacity: 0.62;
            transform: none;
        }

        .owner-auth-switch {
            margin: 26px 0 0;
            text-align: center;
            color: var(--muted);
            font-size: 18px;
        }

        .owner-auth-switch button {
            border: 0;
            padding: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-weight: 800;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .owner-auth-fineprint {
            margin: 32px auto 0;
            max-width: 560px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.45;
        }

        .owner-auth-fineprint a {
            color: var(--muted);
            text-underline-offset: 3px;
        }

        .owner-auth-message {
            display: none;
            border-radius: 16px;
            padding: 14px 16px;
            background: var(--primary-soft);
            color: var(--text);
            font-size: 15px;
            line-height: 1.45;
        }

        .owner-auth-message.is-visible {
            display: block;
        }

        @media (max-width: 640px) {
            body {
                background: var(--background);
            }

            .owner-auth-header {
                height: 78px;
                padding: 0 18px;
            }

            .owner-auth-logo img {
                width: 34px;
                height: 34px;
            }

            .owner-auth-language {
                font-size: 14px;
            }

            .owner-auth-main {
                min-height: calc(100vh - 78px);
                padding: 28px 14px;
                align-items: start;
            }

            .owner-auth-card {
                border-radius: 24px;
                padding: 28px 18px;
            }

            .owner-auth-google,
            .owner-auth-submit,
            .owner-auth-field input {
                min-height: 58px;
                border-radius: 16px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <header class="owner-auth-header">
        <a class="owner-auth-logo" href="propietarios.html" aria-label="Volver a H&aacute;bitat">
            <img src="img/isotipo-lite.jpg" alt="">
            <span>H&aacute;bitat</span>
        </a>
        <div class="owner-auth-language" aria-label="Idioma">
            <span class="material-symbols-outlined">language</span>
            <span>Espa&ntilde;ol</span>
            <span class="material-symbols-outlined">expand_more</span>
        </div>
    </header>

    <main class="owner-auth-main">
        <section class="owner-auth-card" aria-labelledby="owner-auth-title">
            <h1 id="owner-auth-title" class="owner-auth-title">Crea tu cuenta de propietario</h1>
            <p id="owner-auth-subtitle" class="owner-auth-subtitle">Publica tu propiedad gratis, solo te llevar&aacute;
                5 minutos.</p>

            <button id="owner-google-btn" class="owner-auth-google" type="button">
                <span class="google-mark">G</span>
                <span>Continuar con Google</span>
            </button>

            <div class="owner-auth-divider">O usa tu correo electr&oacute;nico</div>

            <form id="owner-auth-form" class="owner-auth-form">
                <div id="owner-name-field" class="owner-auth-field">
                    <label for="owner-name">Nombre completo</label>
                    <input id="owner-name" name="name" type="text" autocomplete="name" placeholder="Tu nombre">
                </div>

                <div class="owner-auth-field">
                    <label for="owner-email">Correo electr&oacute;nico</label>
                    <input id="owner-email" name="email" type="email" autocomplete="email" placeholder="tu@email.com"
                        required>
                </div>

                <div class="owner-auth-field">
                    <label for="owner-password">Contrase&ntilde;a</label>
                    <input id="owner-password" name="password" type="password" autocomplete="new-password"
                        placeholder="M&iacute;nimo 6 caracteres" minlength="6" required>
                </div>

                <p id="owner-auth-message" class="owner-auth-message" role="status"></p>

                <button id="owner-auth-submit" class="owner-auth-submit" type="submit">Continuar</button>
            </form>

            <p class="owner-auth-switch">
                <span id="owner-auth-switch-copy">&iquest;Ya tienes una?</span>
                <button id="owner-auth-mode-btn" type="button">Iniciar sesi&oacute;n</button>
            </p>

            <p class="owner-auth-fineprint">
                Este sitio est&aacute; protegido por reCAPTCHA y se aplican la
                <a href="#">Pol&iacute;tica de Privacidad</a> y los
                <a href="#">T&eacute;rminos del Servicio</a> de Google.
            </p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/owner-login.js"></script>
</body>

</html>
